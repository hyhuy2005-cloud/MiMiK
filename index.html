<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chiêm Tinh & Tướng Pháp Thực Tế</title>
    <style>
        :root {
            --bg-base: #070a13;
            --card-bg: rgba(15, 23, 42, 0.9);
            --primary: #f59e0b;
            --cyan: #06b6d4;
            --cyan-glow: rgba(6, 182, 212, 0.35);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 30px var(--cyan-glow);
        }

        header { text-align: center; margin-bottom: 1.5rem; }
        header h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #fef08a, var(--primary), var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            text-transform: uppercase;
        }

        /* API Key Section */
        .api-key-section {
            background: rgba(30, 41, 59, 0.6);
            border: 1px dashed var(--cyan);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .api-key-section label { display: block; font-size: 0.85rem; color: var(--cyan); margin-bottom: 0.4rem; font-weight: 600; }
        .api-key-section input {
            width: 100%;
            padding: 0.6rem;
            background: #090d16;
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .api-hint { font-size: 0.75rem; color: var(--text-sub); margin-top: 0.4rem; }
        .api-hint a { color: var(--primary); text-decoration: none; }

        /* Tabs */
        .tab-nav { display: flex; justify-content: center; gap: 1rem; margin-bottom: 1.5rem; }
        .tab-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 0.6rem 1.3rem;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, var(--cyan), #2563eb);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 0 15px var(--cyan-glow);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }

        /* Camera Box */
        .camera-card {
            background: rgba(10, 15, 30, 0.8);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.2rem;
            text-align: center;
        }

        .video-wrapper {
            width: 100%;
            max-width: 400px;
            height: 300px;
            margin: 0 auto 1rem auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video, img.preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cam-btn-group { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
        .btn {
            padding: 0.6rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #1e293b;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn:hover { border-color: var(--cyan); color: var(--cyan); }
        .btn-primary {
            background: linear-gradient(135deg, var(--cyan), #0284c7);
            border: none;
            width: 100%;
            padding: 0.8rem;
            font-size: 1rem;
            margin-top: 1rem;
        }

        /* Result Area */
        #result-box {
            display: none;
            margin-top: 2rem;
            background: rgba(10, 15, 30, 0.95);
            border: 1px solid var(--cyan);
            border-radius: 16px;
            padding: 1.5rem;
            line-height: 1.7;
        }
        #result-box h2 { color: var(--primary); margin-bottom: 1rem; font-size: 1.3rem; }
        .loading-spinner {
            display: none;
            text-align: center;
            margin-top: 1rem;
            color: var(--cyan);
            font-weight: 600;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>✦ AI LUẬN GIẢI TƯỚNG PHÁP ✦</h1>
            <p>Sử dụng AI Vision phân tích thực tế từ ảnh chụp bàn tay & khuôn mặt</p>
        </header>

        <!-- API KEY INPUT -->
        <div class="api-key-section">
            <label for="api-key">🔑 Nhập Google Gemini API Key để kích hoạt AI thực:</label>
            <input type="password" id="api-key" placeholder="AIzaSy...">
            <div class="api-hint">
                * Chưa có API Key? Lấy miễn phí tại <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>.
            </div>
        </div>

        <!-- TAB NAVIGATION -->
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('palm')">✋ Bói Chỉ Tay (Camera)</button>
            <button class="tab-btn" onclick="switchTab('face')">👤 Xem Tướng Mặt (Camera)</button>
        </div>

        <!-- ================= TAB 1: PALM ================= -->
        <div id="tab-palm" class="tab-content active">
            <div class="camera-card">
                <div class="video-wrapper">
                    <video id="palm-video" autoplay playsinline></video>
                    <img id="palm-preview" class="preview-img" style="display:none;">
                </div>
                <div class="cam-btn-group">
                    <button class="btn" onclick="startCamera('palm')">📹 Bật Camera Chỉ Tay</button>
                    <button class="btn" onclick="capturePhoto('palm')">📸 Chụp Bàn Tay</button>
                    <label class="btn" for="palm-upload">📁 Tải Ảnh Lên</label>
                    <input type="file" id="palm-upload" accept="image/*" style="display:none;" onchange="handleFileUpload(event, 'palm')">
                </div>
                <button class="btn btn-primary" onclick="analyzeWithAI('palm')">🔮 Gửi AI Phân Tích Chỉ Tay</button>
            </div>
        </div>

        <!-- ================= TAB 2: FACE ================= -->
        <div id="tab-face" class="tab-content">
            <div class="camera-card">
                <div class="video-wrapper">
                    <video id="face-video" autoplay playsinline></video>
                    <img id="face-preview" class="preview-img" style="display:none;">
                </div>
                <div class="cam-btn-group">
                    <button class="btn" onclick="startCamera('face')">📹 Bật Camera Mặt</button>
                    <button class="btn" onclick="capturePhoto('face')">📸 Chụp Khuôn Mặt</button>
                    <label class="btn" for="face-upload">📁 Tải Ảnh Lên</label>
                    <input type="file" id="face-upload" accept="image/*" style="display:none;" onchange="handleFileUpload(event, 'face')">
                </div>
                <button class="btn btn-primary" onclick="analyzeWithAI('face')">🔮 Gửi AI Phân Tích Tướng Mặt</button>
            </div>
        </div>

        <!-- LOADING & RESULT -->
        <div class="loading-spinner" id="loading">⚡ AI đang quan sát hình ảnh và luận giải vận mệnh... Xin chờ giây lát...</div>
        
        <div id="result-box">
            <h2 id="res-title">KẾT QUẢ PHÂN TÍCH TỪ AI VISION</h2>
            <div id="res-content"></div>
        </div>
    </div>

    <!-- Hidden Canvas for snapping photos -->
    <canvas id="snapshot-canvas" style="display:none;"></canvas>

    <script>
        let currentStreams = { palm: null, face: null };
        let capturedBase64 = { palm: null, face: null };

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.currentTarget.classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById('result-box').style.display = 'none';
        }

        // 1. WEBCAM CONTROLLER
        async function startCamera(type) {
            const video = document.getElementById(`${type}-video`);
            const preview = document.getElementById(`${type}-preview`);
            
            preview.style.display = 'none';
            video.style.display = 'block';

            try {
                if (currentStreams[type]) {
                    currentStreams[type].getTracks().forEach(t => t.stop());
                }
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                currentStreams[type] = stream;
            } catch (err) {
                alert("Không thể mở camera. Vui lòng cấp quyền hoặc sử dụng tính năng tải ảnh lên.");
            }
        }

        function capturePhoto(type) {
            const video = document.getElementById(`${type}-video`);
            const preview = document.getElementById(`${type}-preview`);
            const canvas = document.getElementById('snapshot-canvas');

            if (!video.srcObject) {
                alert("Hãy bấm 'Bật Camera' trước khi chụp!");
                return;
            }

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const dataUrl = canvas.toDataURL('image/jpeg');
            capturedBase64[type] = dataUrl.split(',')[1];

            preview.src = dataUrl;
            preview.style.display = 'block';
            video.style.display = 'none';

            if (currentStreams[type]) {
                currentStreams[type].getTracks().forEach(t => t.stop());
            }
        }

        function handleFileUpload(e, type) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const dataUrl = evt.target.result;
                capturedBase64[type] = dataUrl.split(',')[1];

                const video = document.getElementById(`${type}-video`);
                const preview = document.getElementById(`${type}-preview`);
                
                preview.src = dataUrl;
                preview.style.display = 'block';
                video.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        // 2. GEMINI VISION AI CALLER (Fixed Model Endpoint)
        async function analyzeWithAI(type) {
            const apiKey = document.getElementById('api-key').value.trim();
            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('result-box');
            const resContent = document.getElementById('res-content');

            if (!apiKey) {
                alert("Vui lòng nhập Google Gemini API Key để thực hiện phân tích thật!");
                return;
            }

            const base64Data = capturedBase64[type];
            if (!base64Data) {
                alert("Vui lòng chụp ảnh từ Camera hoặc tải ảnh lên trước!");
                return;
            }

            loading.style.display = 'block';
            resultBox.style.display = 'none';

            let prompt = "";
            if (type === 'palm') {
                prompt = "Hãy đóng vai một Bậc Thầy Bói Chỉ Tay chuyên nghiệp. Hãy quan sát thật kỹ các đường chỉ tay (Tâm đạo, Trí đạo, Sinh đạo, Định mệnh) trong bức ảnh này. Cho lời luận giải chi tiết, riêng biệt về: 1. Tình duyên & Cảm xúc, 2. Trí tuệ & Sự nghiệp, 3. Sức khỏe & Năng lượng sống. Trả lời rõ ràng, trình bày đẹp mắt.";
            } else {
                prompt = "Hãy đóng vai một Bậc Thầy Nhân Tướng Học. Hãy quan sát kỹ khuôn mặt trong ảnh (Thượng/Trung/Hạ đình, Mắt, Mũi, Miệng, Thần khí). Đưa ra luận giải chi tiết về: 1. Tổng quan tính cách & Thần khí, 2. Công danh & Tài lộc (Cung Trán, Mũi), 3. Tình duyên & Hậu vận. Trả lời rõ ràng, trình bày đẹp mắt.";
            }

            try {
                // Đã cập nhật sang model gemini-2.5-flash mới nhất ổn định
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                loading.style.display = 'none';

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let text = data.candidates[0].content.parts[0].text;
                    text = text.replace(/```html/g, '').replace(/```/g, '').replace(/\n/g, '<br>');
                    resContent.innerHTML = text;
                    resultBox.style.display = 'block';
                    resultBox.scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert("Lỗi từ API: " + (data.error?.message || JSON.stringify(data)));
                }
            } catch (err) {
                loading.style.display = 'none';
                alert("Có lỗi kết nối tới API. Vui lòng kiểm tra lại mạng hoặc API Key!");
            }
        }
    </script>
</body>
</html>
