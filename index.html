<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Live Builder - Powered by Gemini 3.1 Pro</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background-color: #1e1e1e; color: #fff; }
        .header { padding: 15px 20px; background: #2d2d2d; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; }
        .header h1 { margin: 0; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        .api-input { padding: 8px 12px; width: 350px; border-radius: 6px; border: 1px solid #555; background: #1e1e1e; color: #fff; }
        .container { display: flex; flex: 1; overflow: hidden; }
        .panel { flex: 1; display: flex; flex-direction: column; padding: 20px; }
        .left-panel { border-right: 1px solid #444; }
        textarea { flex: 1; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #555; background: #2d2d2d; color: #fff; font-size: 15px; resize: none; line-height: 1.5; }
        textarea:focus { outline: none; border-color: #0078d4; }
        button { padding: 12px; background: #0078d4; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #005a9e; }
        button:disabled { background: #555; cursor: not-allowed; }
        iframe { flex: 1; border: none; border-radius: 8px; background: #fff; width: 100%; height: 100%; box-shadow: inset 0 0 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚀 AI Live Web Builder (Gemini 3.1 Pro)</h1>
        <input type="password" id="apiKey" class="api-input" placeholder="Dán API Key Gemini của bạn vào đây...">
    </div>

    <div class="container">
        <div class="panel left-panel">
            <textarea id="prompt" placeholder="Nhập yêu cầu thiết kế...&#10;&#10;Ví dụ: Tạo một thẻ giới thiệu sản phẩm (Card) phong cách hiện đại cho thương hiệu nước trái cây Fruzii, có hình ảnh minh họa, tên sản phẩm, mô tả ngắn gọn và nút 'Đặt hàng ngay' màu cam nhấp nháy."></textarea>
            <button id="generateBtn">Tạo Code & Xem trước ngay</button>
        </div>

        <div class="panel right-panel">
            <iframe id="preview" srcdoc="<div style='font-family:sans-serif; text-align:center; margin-top:20%; color:#666;'>Kết quả hiển thị tại đây...</div>"></iframe>
        </div>
    </div>

    <script>
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const apiKey = document.getElementById('apiKey').value.trim();
            const promptText = document.getElementById('prompt').value.trim();
            const btn = document.getElementById('generateBtn');
            const iframe = document.getElementById('preview');

            if (!apiKey) {
                alert('Vui lòng nhập Google Gemini API Key vào góc trên bên phải!');
                return;
            }
            if (!promptText) {
                alert('Vui lòng nhập yêu cầu thiết kế web!');
                return;
            }

            btn.innerText = '⏳ Đang code... Vui lòng đợi!';
            btn.disabled = true;

            // Câu lệnh hệ thống ép AI chỉ trả về code HTML
            const systemPrompt = "Bạn là một lập trình viên Frontend xuất sắc. Hãy viết toàn bộ mã HTML, CSS và JavaScript (nếu có) chung vào một cấu trúc HTML duy nhất để thực hiện yêu cầu của người dùng. Chỉ trả về phần code nằm trong dấu backtick html, tuyệt đối không giải thích hay nói thêm bất kỳ từ nào khác ngoài code.";

            try {
                // Đã gọi đích danh mô hình gemini-3.1-pro-preview
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-pro-preview:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: systemPrompt },
                                { text: "Yêu cầu: " + promptText }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                let responseText = data.candidates[0].content.parts[0].text;

                // Dùng Regex để lọc lấy đúng phần code HTML nằm trong cặp ```html ... ```
                const match = responseText.match(/```html\n([\s\S]*?)\n```/) || responseText.match(/```([\s\S]*?)```/);
                const finalCode = match ? match[1] : responseText;

                // Đẩy code vào iframe để render tức thì
                iframe.srcdoc = finalCode;

            } catch (error) {
                alert('Đã xảy ra lỗi: ' + error.message);
            } finally {
                btn.innerText = 'Tạo Code & Xem trước ngay';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
