<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Lọc Ồn Trình Duyệt</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            color: #333;
            margin-top: 50px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: auto;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        #btnStart { background-color: #4CAF50; color: white; }
        #btnStart:hover { background-color: #45a049; }
        #btnStop { background-color: #f44336; color: white; }
        #btnStop:hover { background-color: #da190b; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        audio { margin-top: 20px; width: 100%; }
        .warning { color: #e67e22; font-size: 0.9em; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎧 Web App Chống Ồn Microphone</h2>
        <p class="warning">⚠️ Lưu ý: Hãy đeo tai nghe trước khi bấm bật Mic để tránh bị tiếng hú (feedback loop) nhé!</p>

        <button id="btnStart">🎙️ Bật Mic (Có lọc ồn)</button>
        <button id="btnStop" disabled>⏹️ Tắt Mic</button>

        <br>
        <audio id="audioOutput" autoplay controls></audio>
    </div>

    <script>
        let localStream;
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const audioOutput = document.getElementById('audioOutput');

        btnStart.onclick = async () => {
            try {
                // Yêu cầu quyền sử dụng Microphone với các cấu hình lọc âm thanh
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        noiseSuppression: true,  // Kích hoạt chống ồn (Thường dùng thuật toán/AI của trình duyệt)
                        echoCancellation: true,  // Kích hoạt chống vang
                        autoGainControl: true    // Tự động điều chỉnh âm lượng cho đều
                    }
                });

                // Chuyển luồng âm thanh vào thẻ <audio> để cậu tự nghe lại giọng mình
                audioOutput.srcObject = localStream;
                
                // Đổi trạng thái nút
                btnStart.disabled = true;
                btnStop.disabled = false;
            } catch (err) {
                alert("Lỗi khi truy cập Microphone! Hãy chắc chắn bạn đã cấp quyền cho trình duyệt.\nChi tiết: " + err);
            }
        };

        btnStop.onclick = () => {
            // Tắt toàn bộ các track âm thanh
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                audioOutput.srcObject = null;
            }
            
            // Đổi trạng thái nút
            btnStart.disabled = false;
            btnStop.disabled = true;
        };
    </script>

</body>
</html>
